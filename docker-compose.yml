version: "3"

services:
  dev-build:
    image: todo-app:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development

  dev-run:
    image: todo-app:dev
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    volumes:
      - .:/app

  dev-debug:
    image: todo-app:dev
    env_file:
      - ./.env
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - todo_app:/app/todo_app
    entrypoint: tail -f /dev/null

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  todo_app:
